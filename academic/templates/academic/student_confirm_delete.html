{% extends "academic/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3><i class="fas fa-exclamation-triangle"></i> Confirmar Eliminación</h3>
                </div>
                <div class="card-body">
                    <p>¿Estás seguro de eliminar al estudiante <strong>{{ student.name }}</strong>?</p>
                    <p class="text-danger">Esta acción eliminará todos los registros y predicciones asociadas.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> Sí, eliminar
                            </button>
                            <a href="{% url 'academic:student_list' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
